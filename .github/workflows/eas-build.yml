name: EAS Build
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, ios]
        default: android
        required: true
      profile:
        type: choice
        options: [preview, production]
        default: preview
        required: true
permissions:
  contents: read
concurrency:
  group: eas-${{ inputs.profile }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.13.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build and wait for result
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_PROFILE: ${{ inputs.profile }}
        run: eas build --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" --non-interactive --wait
